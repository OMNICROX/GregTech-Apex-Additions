plugins {
    id 'java-library'
    id 'idea'
    id 'net.neoforged.moddev.legacyforge' version '2.0.86'
}

version = project.mod_version
group = project.maven_group
base { archivesName = "${project.mod_id}-${project.minecraft_version}" }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

repositories {
    mavenCentral()
    maven { url = 'https://maven.gtceu.com' }                  // GTCEu
    maven { url = 'https://maven.firstdark.dev/snapshots' }    // LDLib
    maven { url = 'https://maven.firstdark.dev/releases' }
    maven { url = 'https://maven.tterrag.com/' }                // Registrate
    maven { url = 'https://maven.blamejared.com/' }             // JEI
    maven { url = 'https://modmaven.dev' }                      // AE2
    maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } }
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
}

legacyForge {
    version = project.forge_version
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }
    mods {
        "${project.mod_id}" { sourceSet(sourceSets.main) }
    }
    runs {
        client {
            client()
            jvmArguments.addAll('-Xmx4G')
            if (project.hasProperty('quickplay')) programArguments.addAll('--quickPlaySingleplayer', project.quickplay)
        }
        server {
            server()
            jvmArguments.addAll('-Xmx5G')
        }
        data {
            data()
            programArguments.addAll('--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath,
                    '--existing-mod', 'gtceu')
        }
    }
}

dependencies {
    modImplementation "com.gregtechceu.gtceu:gtceu-1.20.1:${project.gtceu_version}"
    modImplementation "com.lowdragmc.ldlib:ldlib-forge-1.20.1:${project.ldlib_version}"
    modImplementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    modImplementation "dev.toma.configuration:configuration-forge-1.20.1:${project.configuration_version}"
    modCompileOnly "appeng:appliedenergistics2-forge:15.4.10"
    compileOnly 'org.jetbrains:annotations:26.0.1'
    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    var props = [mod_id: project.mod_id, mod_name: project.mod_name, mod_version: project.mod_version,
                 mod_license: project.mod_license, mod_authors: project.mod_authors,
                 mod_description: project.mod_description, gtceu_version: project.gtceu_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}

// local test only: ./gradlew runServer -Pdevmods  (remaps ../devmods/*.jar into the dev run)
if (project.hasProperty('devmods')) {
    repositories { flatDir { dirs '../devmods' } }
    dependencies {
        file('../devmods').listFiles().findAll { it.name.endsWith('.jar') }.each { f ->
            modRuntimeOnly "devmods:${f.name - '.jar'}"
        }
    }
}
