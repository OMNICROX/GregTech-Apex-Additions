plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
    id 'com.gradleup.shadow' version '8.3.5'
}

// Apex Guide: fork of GuideME 20.1 (LGPL-3.0) with a GuideNH-style UI (LGPL-3.0)
version = project.apexguide_version
group = 'com.omnicrox.apexguide'
base { archivesName = "apexguide-${project.minecraft_version}" }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

repositories { mavenCentral() }

sourceSets {
    // Dev-only: the GTAA guide pages as a resource mod, so the UI can be checked without GTAA
    testmod {}
}

configurations {
    shaded { transitive = false }
    compileClasspath.extendsFrom shaded
    runtimeClasspath.extendsFrom shaded
}

legacyForge {
    version = project.forge_version
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }
    mods {
        apexguide { sourceSet(sourceSets.main) }
        testmod { sourceSet(sourceSets.testmod) }
    }
    runs {
        client {
            client()
            gameDirectory = project.file('run')
            sourceSet = sourceSets.testmod
            loadedMods = [mods.apexguide, mods.testmod]
            additionalRuntimeClasspathConfiguration.extendsFrom configurations.shaded
            if (project.hasProperty('showGuide')) systemProperty('apexguide.showOnStartup', project.showGuide)
        }
    }
}

dependencies {
    compileOnly 'org.jetbrains:annotations:26.0.1'
    shaded "io.methvin:directory-watcher:0.17.1"
    shaded "org.yaml:snakeyaml:1.33"
    ['core', 'analysis-common', 'queryparser', 'facet', 'queries', 'highlighter', 'memory'].each {
        shaded "org.apache.lucene:lucene-${it}:9.12.1"
    }
}

// copy the real guide pages into the test mod
tasks.named('processTestmodResources', ProcessResources) {
    from('../src/main/resources/assets/gtapexadditions/guides') { into 'assets/gtapexadditions/guides' }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    var props = [version: project.apexguide_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml']) { expand props }
}

jar {
    archiveClassifier = 'plain'
    manifest.attributes('MixinConfigs': 'apexguide.optional.mixins.json')
}

shadowJar {
    from sourceSets.main.output
    from('LICENSE.md') { rename { 'LICENSE-apexguide.md' } }
    dependencies { exclude 'META-INF/maven/**' }
    mergeServiceFiles()
    manifest.attributes('MixinConfigs': 'apexguide.optional.mixins.json')
    relocate 'io.methvin', 'com.omnicrox.apexguide.internal.shaded.methvin'
    relocate 'org.yaml.snakeyaml', 'com.omnicrox.apexguide.internal.shaded.snakeyaml'
    relocate 'org.apache.lucene', 'com.omnicrox.apexguide.internal.shaded.lucene'
    relocate 'org.tartarus.snowball', 'com.omnicrox.apexguide.internal.shaded.snowball'
    configurations = [project.configurations.shaded]
    archiveClassifier = 'dev'
}

obfuscation {
    reobfuscate(tasks.named('shadowJar'), sourceSets.main) { archiveClassifier = '' }
}
reobfJar.enabled = false
tasks.assemble.dependsOn reobfShadowJar
