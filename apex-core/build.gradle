plugins {
    id 'java-library'
    id 'net.neoforged.moddev.legacyforge'
}

evaluationDependsOn(':apex-lib')

version = project.apexcore_version
group = 'com.omnicrox.apexcore'
base { archivesName = "apexcore-${project.minecraft_version}" }

java { toolchain.languageVersion = JavaLanguageVersion.of(17) }

repositories {
    mavenCentral()
    maven { url = 'https://maven.gtceu.com' }
    maven { url = 'https://maven.firstdark.dev/snapshots' }
    maven { url = 'https://maven.firstdark.dev/releases' }
    maven { url = 'https://maven.tterrag.com/' }
}

legacyForge {
    version = project.forge_version
    parchment {
        minecraftVersion = project.minecraft_version
        mappingsVersion = project.parchment_version
    }
    mods {
        apexcore { sourceSet(sourceSets.main) }
        apexlib { sourceSet(project(':apex-lib').sourceSets.main) }
    }
}

dependencies {
    implementation project(':apex-lib')
    modImplementation "com.gregtechceu.gtceu:gtceu-1.20.1:${project.gtceu_version}"
    modImplementation "com.lowdragmc.ldlib:ldlib-forge-1.20.1:${project.ldlib_version}"
    modImplementation "com.tterrag.registrate:Registrate:${project.registrate_version}"
    compileOnly 'org.jetbrains:annotations:26.0.1'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

processResources {
    var props = [apexcore_version: project.apexcore_version, apexlib_version: project.apexlib_version, gtceu_version: project.gtceu_version]
    inputs.properties props
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) { expand props }
}
